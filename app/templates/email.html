<!DOCTYPE html>
<html>
  <head>
    <title>Enter Email</title>
    <style>
      body {
        max-width: 400px;
        margin: 0 auto;
        padding: 20px;
        font-family: Arial;
      }
      .container {
        text-align: center;
      }
      input[type="email"],
      input[type="text"] {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      button {
        padding: 10px 20px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background: #0056b3;
      }
      .error {
        color: #dc3545;
        margin: 10px 0;
      }
    </style>
